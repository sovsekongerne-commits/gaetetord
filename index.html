<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gæt et ord</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Import Fredoka font for a playful look -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5) rotate(-5deg); }
            60% { opacity: 1; transform: scale(1.05) rotate(2deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        .animate-pop {
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }
        .animate-wiggle {
            animation: wiggle 2s ease-in-out infinite;
        }
        
        /* New Dance Animation for buttons */
        @keyframes dance {
            0% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.05) rotate(-2deg); }
            50% { transform: scale(1) rotate(0deg); }
            75% { transform: scale(1.05) rotate(2deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .animate-dance {
            animation: dance 2s ease-in-out infinite;
        }

        /* Hover dance only */
        .hover-dance:hover {
            animation: dance 2s ease-in-out infinite;
        }
        
        /* 3D Button Effect classes */
        .btn-3d {
            transition: transform 0.1s;
            transform: translateY(0);
            border-bottom-width: 6px;
        }
        .btn-3d:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
            margin-top: 4px; /* To prevent layout shift visually */
        }

        /* Spring Flip Animation Physics - Adjusted to 0.7s (30% faster) */
        .spring-flip {
            transition: transform 0.7s cubic-bezier(0.68, -0.6, 0.32, 1.6);
        }
        
        /* Utility for 3D preservation */
        .preserve-3d {
            transform-style: preserve-3d;
        }
        
        /* Utility for backface visibility */
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
    </style>
<script type="importmap">
